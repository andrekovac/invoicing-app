openapi: 3.0.3
info:
  title: Rechnungen API v1
  version: 1.6.0
  description: |
    Api of the invoicing app. All amounts are euros as numbers (119.0), dates are
    `YYYY-MM-DD`. Login sets the session cookie `rsid`, every other call sends it.
    Errors come as `{ "error": "text" }` (v1). The read only v2 (`/api/v2`) is not
    in this file yet.
servers:
  - url: http://localhost:4730/api/v1
security:
  - session: []

tags:
  - name: auth
  - name: customers
  - name: invoices
  - name: items
  - name: payments
  - name: portal
  - name: recurring
  - name: products
  - name: reports
  - name: export
  - name: admin

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in, sets the session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: jonas@agentur-brandt.example }
                password: { type: string }
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: E-Mail oder Passwort falsch }
        '403': { description: Account is not active }
        '429': { description: Too many wrong passwords, locked for 15 minutes }
  /auth/signup:
    post:
      tags: [auth]
      security: []
      summary: New company with its first user (admin), logs in right away
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, email, password]
              properties:
                company: { type: string }
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                plan: { type: string, enum: [basic, pro] }
      responses:
        '201': { description: The new user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: E-Mail exists }
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      responses:
        '204': { description: Logged out }
  /auth/me:
    get:
      tags: [auth]
      summary: Logged in user with account name and plan
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    post:
      tags: [auth]
      summary: Change own password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /customers:
    get:
      tags: [customers]
      summary: Customers of the account, sorted by name, with the open amount
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'search in name, city and contact' }
      responses:
        '200':
          description: List
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } }
    post:
      tags: [customers]
      summary: New customer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /customers/duplicates:
    get:
      tags: [customers]
      summary: Groups of customers that look like the same company
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string, example: krause }
                    customers: { type: array, items: { $ref: '#/components/schemas/Customer' } }
  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customers]
      summary: One customer
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [customers]
      summary: Change fields (only the ones sent)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [customers]
      summary: Delete a customer without invoices
      responses:
        '204': { description: Deleted }
        '409': { description: Kunde hat noch Rechnungen }
  /customers/{id}/invoices:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customers]
      summary: Invoices of the customer
      responses:
        '200':
          description: List
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } } } }
  /customers/{id}/portal-mail:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [customers]
      summary: Mail with the portal link (outbox)
      responses:
        '201': { description: Mail in the outbox, content: { application/json: { schema: { $ref: '#/components/schemas/Mail' } } } }
        '400': { description: Kunde hat keine E-Mail-Adresse }
  /customers/{id}/merge:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [customers]
      summary: Move the invoices of `from` to this customer and delete `from` (admins)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [from], properties: { from: { type: integer } } }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
                  invoices_moved: { type: integer }
                  fields_filled: { type: array, items: { type: string } }
        '403': { description: keine Berechtigung }

  /invoices:
    get:
      tags: [invoices]
      summary: Invoices of the account
      description: |
        Without `page` and `per_page` all invoices come back (the old admin and the
        customer page need that). With one of them the list is paged.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: q, in: query, schema: { type: string }, description: 'number or customer name' }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'issue date from' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'issue date to' }
        - { name: sort, in: query, schema: { type: string, enum: [id, number, issue_date, due_date, total_gross, customer_name, status] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: List
          headers:
            X-Total-Count: { description: number of invoices for the pager, schema: { type: integer } }
            X-Page: { description: only when paged, schema: { type: integer } }
            X-Per-Page: { description: only when paged, schema: { type: integer } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [invoices]
      summary: New draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } }
      responses:
        '201': { description: The draft, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /invoices/summary:
    get:
      tags: [invoices]
      summary: Numbers for the overview (open, overdue, paid this year, drafts)
      responses:
        '200': { description: Numbers, content: { application/json: { schema: { $ref: '#/components/schemas/Summary' } } } }
  /invoices/years:
    get:
      tags: [invoices]
      summary: Years with invoices, newest first
      responses:
        '200': { description: Years, content: { application/json: { schema: { type: array, items: { type: string, example: '2023' } } } } }
  /invoices/preview:
    post:
      tags: [invoices]
      summary: Totals for the form while typing, nothing is saved
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } }
      responses:
        '200': { description: Totals, content: { application/json: { schema: { $ref: '#/components/schemas/Totals' } } } }
  /invoices/bulk:
    post:
      tags: [invoices]
      summary: One action for several invoices, each on its own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [issue, paid, cancel, remind, mail, sent, delete] }
                ids: { type: array, items: { type: integer }, maxItems: 100 }
                paid_at: { type: string, format: date }
                via: { type: string, enum: [mail, post, portal, other], description: 'for sent, default post' }
                sent_at: { type: string, format: date }
      responses:
        '200':
          description: Result per invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: integer }
                  failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        ok: { type: boolean }
                        number: { type: string }
                        error: { type: string }
  /invoices/overdue:
    get:
      tags: [invoices]
      summary: Overdue invoices with the date of the last reminder
      responses:
        '200': { description: List }
  /invoices/by-number/{number}:
    get:
      tags: [invoices]
      summary: Lookup by number, also loose input (re-2021-87, 2021-0087)
      parameters:
        - { name: number, in: path, required: true, schema: { type: string, example: RE-2021-0087 } }
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { description: 'Ungültige Rechnungsnummer' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [invoices]
      summary: Invoice with items and customer
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [invoices]
      summary: Save from the form
      description: Issued invoices keep their totals, only texts, dates and the note change.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } }
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: cancelled, or other number of items on an issued invoice }
    delete:
      tags: [invoices]
      summary: Delete a draft
      responses:
        '204': { description: Deleted }
        '409': { description: nur Entwürfe können gelöscht werden }
  /invoices/{id}/pdf:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [invoices]
      summary: PDF of the invoice
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [txt] }, description: 'same lines as plain text' }
        - { name: download, in: query, schema: { type: string }, description: 'any value: as attachment' }
      responses:
        '200':
          description: PDF or text
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
  /invoices/{id}/events:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [invoices]
      summary: History (created, updated, issued, paid, cancelled, note)
      responses:
        '200':
          description: Events, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } }
  /invoices/{id}/issue:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [invoices]
      summary: Draft to issued, gives the number (and due date +14 days when empty)
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { description: Rechnung ist schon gestellt }
  /invoices/{id}/paid:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [invoices]
      summary: Mark as paid, the open rest is booked as a transfer
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { paid_at: { type: string, format: date } } }
      responses:
        '200': { description: Invoice }
        '409': { description: nur gestellte Rechnungen können bezahlt werden }
  /invoices/{id}/copy:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [invoices]
      summary: Copy as a new draft
      responses:
        '201': { description: The copy }
  /invoices/{id}/mail:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [invoices]
      summary: Mail text for the customer (to copy by hand)
      responses:
        '200':
          description: Mail text
          content:
            application/json:
              schema: { type: object, properties: { to: { type: string }, subject: { type: string }, body: { type: string } } }
    post:
      tags: [invoices]
      summary: Invoice mail with a payment link into the outbox
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { to: { type: string } } }
      responses:
        '201': { description: Mail, content: { application/json: { schema: { $ref: '#/components/schemas/Mail' } } } }
  /invoices/{id}/remind:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [invoices]
      summary: Reminder by hand
      responses:
        '201': { description: Mail, content: { application/json: { schema: { $ref: '#/components/schemas/Mail' } } } }
        '409': { description: Rechnung ist nicht überfällig }
  /invoices/{id}/note:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [invoices]
      summary: Internal note, also for issued invoices
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } }
      responses:
        '200': { description: Invoice }
  /invoices/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [invoices]
      summary: Cancel
      responses:
        '200': { description: Invoice }
        '409': { description: schon storniert }
  /invoices/{id}/items:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [items]
      summary: Add an item to a draft
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemInput' } } }
      responses:
        '201': { description: Invoice }
        '409': { description: not a draft }
  /invoices/{id}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: itemId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [items]
      summary: Change an item of a draft
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemInput' } } }
      responses:
        '200': { description: Invoice }
    delete:
      tags: [items]
      summary: Remove an item of a draft
      responses:
        '200': { description: Invoice }

  /payments:
    get:
      tags: [payments]
      summary: Payments of the account, or of one invoice with `invoice_id`
      parameters:
        - { name: invoice_id, in: query, schema: { type: integer } }
        - { name: method, in: query, schema: { type: string, enum: [transfer, card] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: List }
    post:
      tags: [payments]
      summary: Bank transfer, also partial
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, amount]
              properties:
                invoice_id: { type: integer }
                amount: { oneOf: [{ type: number }, { type: string, example: '50,00' }] }
                paid_at: { type: string, format: date }
                reference: { type: string }
      responses:
        '201': { description: The payment with the open rest }
        '400': { $ref: '#/components/responses/BadRequest' }
  /payments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [payments]
      summary: Remove a transfer (card payments only via CardPay)
      responses:
        '204': { description: Removed }
  /payments/link:
    post:
      tags: [payments]
      summary: New payment link for an open invoice
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { invoice_id: { type: integer }, days: { type: integer, minimum: 1, maximum: 365 } } }
      responses:
        '201': { description: 'Link { url, token, expires_at }' }
  /payments/card:
    post:
      tags: [payments]
      summary: Card payment taken in the office
      responses:
        '201': { description: Charged }
        '402': { description: Card declined }
  /payments/link/{token}:
    get:
      tags: [payments]
      security: []
      summary: Invoice behind a payment link (no login)
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200': { description: Number, amounts, company }
        '404': { description: Link ungültig oder abgelaufen }
  /payments/link/{token}/card:
    post:
      tags: [payments]
      security: []
      summary: Pay with card from the payment link
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '201': { description: Charged }

  /portal:
    post:
      tags: [portal]
      summary: Portal link for a customer
      responses:
        '201': { description: Link }
  /portal/{token}:
    get:
      tags: [portal]
      security: []
      summary: Open invoices of the customer
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200': { description: Customer and open invoices }
  /portal/{token}/cart:
    post:
      tags: [portal]
      security: []
      summary: Sum of the chosen invoices
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200': { description: Sum }
  /portal/{token}/pay:
    post:
      tags: [portal]
      security: []
      summary: Pay the chosen invoices with one card payment
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '201': { description: Charged }
  /portal/{token}/invoices/{id}/pdf:
    get:
      tags: [portal]
      security: []
      summary: PDF of one invoice of the customer
      parameters:
        - { $ref: '#/components/parameters/Token' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: PDF }

  /admin/account:
    get:
      tags: [admin]
      summary: Company data
      responses:
        '200': { description: Account }
    put:
      tags: [admin]
      summary: Change company data
      responses:
        '200': { description: Account }
  /admin/outbox:
    get:
      tags: [admin]
      summary: Last mails of the outbox
      responses:
        '200': { description: Mails }
  /admin/imports:
    get:
      tags: [admin]
      summary: Imports from the desktop program
      responses:
        '200': { description: Imports }
  /admin/users:
    get:
      tags: [admin]
      summary: Users of the account
      responses:
        '200': { description: Users }
    post:
      tags: [admin]
      summary: New user
      responses:
        '201': { description: User }
  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [admin]
      summary: Change user (name, role, password)
      responses:
        '200': { description: User }
    delete:
      tags: [admin]
      summary: Delete user
      responses:
        '204': { description: Deleted }

  /customers/search:
    get:
      tags: [customers]
      summary: Customer search by part of the name (any case)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: with_open, in: query, schema: { type: string, enum: ['1'] }, description: 'only customers with open invoices' }
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 50 } }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomerHit' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /customers/{id}/statement:
    get:
      tags: [customers]
      summary: Statement of account (invoices and payments with running balance)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, pdf, txt], default: json } }
      responses:
        '200':
          description: Statement
          content:
            application/json: { schema: { $ref: '#/components/schemas/Statement' } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/export.csv:
    get:
      tags: [invoices]
      summary: The invoice list as csv (same filters as GET /invoices, no paging)
      responses:
        '200': { description: CSV (semicolon, utf-8 with BOM), content: { text/csv: { schema: { type: string } } } }
  /invoices/recurring:
    get:
      tags: [recurring]
      summary: Recurring invoices of the account
      responses:
        '200': { description: List, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recurring' } } } } }
    post:
      tags: [recurring]
      summary: New recurring invoice from a template invoice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
        '400': { description: 'Wrong input, as `{ errors: [{ field, message }] }`' }
  /invoices/recurring/{rid}:
    parameters:
      - { name: rid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [recurring]
      summary: One recurring invoice with its copies and a preview of the next one
      responses:
        '200': { description: Recurring invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [recurring]
      summary: Change interval, day, payment days, end, auto_issue, send_mail, title
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInput' } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
    delete:
      tags: [recurring]
      summary: Delete (the copies stay)
      responses:
        '204': { description: Deleted }
  /invoices/recurring/{rid}/pause:
    post:
      tags: [recurring]
      summary: Pause
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Paused, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
  /invoices/recurring/{rid}/resume:
    post:
      tags: [recurring]
      summary: Resume (no copies for the months in between)
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Active again, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
        '409': { description: ended }
  /invoices/recurring/{rid}/run:
    post:
      tags: [recurring]
      summary: Make the next copy now
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: The new invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { description: ended }
  /invoices/{id}/recurring:
    post:
      tags: [recurring]
      summary: This invoice as template for a recurring invoice (default start next month)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Recurring' } } } }
  /invoices/{id}/credit-note:
    post:
      tags: [invoices]
      summary: Credit note (negative amounts, own number) for an issued or paid invoice
      description: |
        Without `items` the whole invoice is credited. The credit note is paid right away and
        is booked on the original as a payment with method `credit`. Whole invoice and nothing
        paid yet: the original is cancelled.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                items: { type: array, items: { type: object, properties: { item_id: { type: integer }, quantity: { type: number } } } }
      responses:
        '201': { description: The credit note, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { description: 'draft, cancelled or more than the invoice' }
  /invoices/{id}/credit-notes:
    get:
      tags: [invoices]
      summary: Credit notes of an invoice
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: List, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } } } } }
  /invoices/not-sent:
    get:
      tags: [invoices]
      summary: Issued in the last 60 days and not sent yet
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    number: { type: string }
                    issue_date: { type: string, format: date }
                    total_gross: { type: number }
                    customer_name: { type: string }
                    customer_email: { type: string, nullable: true }
  /invoices/{id}/sent:
    post:
      tags: [invoices]
      summary: Mark as sent (by post, own mail program, ...). The invoice mail does it by itself
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                via: { type: string, enum: [mail, post, portal, other], default: post }
                sent_at: { type: string, format: date, description: 'default today, not in the future' }
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: draft or cancelled }
    delete:
      tags: [invoices]
      summary: Not sent after all
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { description: not marked as sent }
  /invoices/{id}/due-date:
    put:
      tags: [invoices]
      summary: Payment extension for an open invoice (amounts stay)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due_date]
              properties:
                due_date: { type: string, format: date, description: 'not before the issue date, at most one year after it' }
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: not issued }
  /invoices/{id}/items/paste:
    post:
      tags: [invoices]
      summary: Positions pasted from a spreadsheet (description, quantity, price per line, tab or ;), drafts only
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "Flyer A5\t2\t69,90" }
                replace: { type: boolean, default: false, description: 'true = instead of the positions so far' }
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { description: 'Wrong lines, as `{ errors: [{ line, message }] }`' }
        '409': { description: not a draft }
  /invoices/{id}/timeline:
    get:
      tags: [invoices]
      summary: History, payments, mails, card attempts and attachments in one list, newest first
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: kinds, in: query, schema: { type: string }, description: 'comma list of event, payment, mail, card, attachment' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: Entries, `X-Total-Count` = all entries before the limit
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, example: '2025-04-15 10:40:00' }
                    kind: { type: string, enum: [event, payment, mail, card, attachment] }
                    type: { type: string, example: issued }
                    user_name: { type: string, nullable: true }
                    data: { type: object, nullable: true }
        '400': { description: 'Unknown kind, as `{ errors: [{ field, message }] }`' }
  /invoices/{id}/attachments:
    get:
      tags: [invoices]
      summary: Attachments of an invoice (without the files)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: List, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Attachment' } } } } }
    post:
      tags: [invoices]
      summary: Attach a file (PDF, PNG, JPG, TXT, CSV, at most 700 KB, 10 per invoice)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, data]
              properties:
                filename: { type: string, example: Lieferschein 4711.pdf }
                data: { type: string, description: 'base64 or a data url' }
                kind: { type: string, enum: [delivery_note, order, offer, other], default: other }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '200': { description: 'Same file was there already', content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: too many attachments }
        '413': { description: file too big }
  /invoices/{id}/attachments/{aid}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: aid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [invoices]
      summary: The file (`?download=1` as download)
      responses:
        '200': { description: File, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [invoices]
      summary: New name (same ending) or kind
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
                kind: { type: string, enum: [delivery_note, order, offer, other] }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [invoices]
      summary: Remove
      responses:
        '204': { description: Removed }
  /products:
    get:
      tags: [products]
      summary: Products (only active ones without `all=1`)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'start of the number or part of the name' }
        - { name: all, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: List, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }
    post:
      tags: [products]
      summary: New product
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { description: 'Wrong input, as `{ errors: [{ field, message }] }`' }
        '409': { description: number exists }
  /products/import:
    post:
      tags: [products]
      summary: Import the old price list (csv Artikelnummer;Bezeichnung;Einheit;Preis;USt)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { csv: { type: string } } } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  errors: { type: array, items: { type: object, properties: { line: { type: integer }, message: { type: string } } } }
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [products]
      summary: One product
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    put:
      tags: [products]
      summary: Change (also `active`)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    delete:
      tags: [products]
      summary: Delete, or archive when the product is on invoices
      responses:
        '200': { description: 'Archived: `{ archived: true, product }`' }
        '204': { description: Deleted }
  /reports/revenue:
    get:
      tags: [reports]
      summary: Revenue per month of a year (billed, received, drafts)
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200': { description: 12 months and the total, content: { application/json: { schema: { $ref: '#/components/schemas/Revenue' } } } }
        '400': { description: 'Wrong year, as `{ message }`' }
  /reports/open-items:
    get:
      tags: [reports]
      summary: Open invoices with days overdue, in buckets
      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Open items }
  /reports/top-customers:
    get:
      tags: [reports]
      summary: Customers with the most revenue in a year
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Ranking }
  /reports/tax:
    get:
      tags: [reports]
      summary: Net and tax per tax rate (year or quarter)
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: quarter, in: query, schema: { type: integer, enum: [1, 2, 3, 4] } }
      responses:
        '200': { description: Per rate }
  /reports/recurring:
    get:
      tags: [reports]
      summary: Coming copies of recurring invoices
      parameters:
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 3 } }
      responses:
        '200': { description: Coming invoices }
  /reports/years:
    get:
      tags: [reports]
      summary: Years with invoices
      responses:
        '200': { description: Years }
  /export/invoices.csv:
    get:
      tags: [export]
      summary: One row per invoice (issued and paid) of the period
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cancelled, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: CSV (semicolon, utf-8 with BOM), content: { text/csv: { schema: { type: string } } } }
  /export/items.csv:
    get:
      tags: [export]
      summary: One row per position
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /export/customers.csv:
    get:
      tags: [export]
      summary: Customers with debtor numbers (10000 + id)
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /export/datev.csv:
    get:
      tags: [export]
      summary: Old booking export for the tax advisor (windows-1252, fixed columns)
      description: |
        Same columns as the desktop program wrote: Umsatz, Soll/Haben, WKZ, Konto (debtor),
        Gegenkonto (revenue account SKR03), BU-Schlüssel, Belegdatum (DDMM), Belegfeld 1 and 2,
        Buchungstext, USt-Satz. Cancelled invoices come twice (S and H).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /export/datev/summary:
    get:
      tags: [export]
      summary: Bookings and gross per tax rate of the booking export
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Per rate }
  /admin/flags:
    get:
      tags: [admin]
      summary: Feature flags of the account
      responses:
        '200': { description: Flags, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Flag' } } } } }
  /admin/flags/{name}:
    put:
      tags: [admin]
      summary: 'Switch a flag for the account (`enabled: null` = back to the default)'
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, example: NEW_PDF_LAYOUT } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, nullable: true } } } } }
      responses:
        '200': { description: The flag, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rsid
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Wrong input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: nicht angemeldet
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Status:
      type: string
      enum: [draft, issued, paid, cancelled]
    User:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
        account_name: { type: string }
        plan: { type: string }
    CustomerInput:
      type: object
      properties:
        name: { type: string }
        contact_name: { type: string }
        street: { type: string }
        zip: { type: string }
        city: { type: string }
        country: { type: string, description: free text }
        email: { type: string }
        phone: { type: string }
        vat_id: { type: string }
        default_tax_rate: { type: integer, enum: [19, 7, 0], nullable: true }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          properties:
            id: { type: integer }
            account_id: { type: integer }
            legacy_no: { type: string, nullable: true }
            open_amount: { type: number }
            created_at: { type: string }
    ItemInput:
      type: object
      properties:
        description: { type: string }
        quantity: { type: number }
        unit_price: { oneOf: [{ type: number }, { type: string, example: '12,50' }] }
    Item:
      type: object
      properties:
        id: { type: integer }
        position: { type: integer }
        description: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
    InvoiceInput:
      type: object
      properties:
        customer_id: { type: integer }
        tax_rate: { type: integer, enum: [19, 7, 0] }
        vat_rate: { type: number, description: 'old clients: 0.19', deprecated: true }
        discount_percent: { type: number, minimum: 0, maximum: 50 }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        note: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ItemInput' } }
    Totals:
      type: object
      properties:
        total_net: { type: number }
        total_tax: { type: number }
        total_gross: { type: number }
    InvoiceListItem:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          properties:
            id: { type: integer }
            number: { type: string, nullable: true, example: RE-2023-0042 }
            status: { $ref: '#/components/schemas/Status' }
            customer_id: { type: integer }
            customer_name: { type: string }
            issue_date: { type: string, nullable: true }
            due_date: { type: string, nullable: true }
            paid_at: { type: string, nullable: true }
            tax_rate: { type: integer }
            discount_percent: { type: number }
            paid_amount: { type: number }
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceListItem'
        - type: object
          properties:
            note: { type: string, nullable: true }
            sent_at: { type: string, format: date, nullable: true }
            sent_via: { type: string, nullable: true, enum: [mail, post, portal, other] }
            items: { type: array, items: { $ref: '#/components/schemas/Item' } }
            customer: { $ref: '#/components/schemas/Customer' }
    Summary:
      type: object
      properties:
        open_count: { type: integer }
        open_gross: { type: number }
        overdue_count: { type: integer }
        overdue_gross: { type: number }
        paid_this_year: { type: number }
        draft_count: { type: integer }
        draft_gross: { type: number }
    Attachment:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        filename: { type: string }
        mime: { type: string, example: application/pdf }
        size: { type: integer }
        sha256: { type: string }
        kind: { type: string, enum: [delivery_note, order, offer, other] }
        uploaded_by: { type: integer, nullable: true }
        uploaded_by_name: { type: string, nullable: true }
        created_at: { type: string }
    Event:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: issued }
        data: { type: object, nullable: true }
        user_id: { type: integer, nullable: true }
        user_name: { type: string, nullable: true }
        created_at: { type: string }
    Mail:
      type: object
      properties:
        id: { type: integer }
        template: { type: string }
        to_email: { type: string }
        subject: { type: string }
        body: { type: string }
        created_at: { type: string }
    CustomerHit:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        contact_name: { type: string, nullable: true }
        zip: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        email: { type: string, nullable: true }
        legacy_no: { type: string, nullable: true }
        invoice_count: { type: integer }
        last_invoice_date: { type: string, nullable: true }
        open_amount: { type: number }
    Statement:
      type: object
      properties:
        customer: { type: object }
        from: { type: string }
        to: { type: string }
        opening_balance: { type: number }
        debit: { type: number }
        credit: { type: number }
        closing_balance: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              type: { type: string, enum: [invoice, payment] }
              text: { type: string }
              debit: { type: number }
              credit: { type: number }
              balance: { type: number }
    RecurringInput:
      type: object
      properties:
        template_invoice_id: { type: integer }
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        interval_months: { type: integer, enum: [1, 2, 3, 6, 12], default: 1 }
        day_of_month: { type: integer, minimum: 1, maximum: 31 }
        payment_days: { type: integer, minimum: 0, maximum: 90, default: 14 }
        auto_issue: { type: boolean, default: true }
        send_mail: { type: boolean, default: false }
    Recurring:
      allOf:
        - $ref: '#/components/schemas/RecurringInput'
        - type: object
          properties:
            id: { type: integer }
            customer_id: { type: integer }
            customer_name: { type: string }
            template_number: { type: string, nullable: true }
            next_date: { type: string, nullable: true, description: 'null = ended' }
            active: { type: integer, enum: [0, 1] }
            last_run_at: { type: string, nullable: true }
            copies: { description: 'list: number of copies, detail: the copies' }
            next: { type: object, nullable: true, description: 'detail only: preview of the next copy' }
    ProductInput:
      type: object
      properties:
        sku: { type: string, example: VK-100 }
        name: { type: string }
        unit: { type: string, nullable: true }
        unit_price: { oneOf: [{ type: number }, { type: string, example: '3,85' }] }
        tax_rate: { type: integer, enum: [19, 7, 0], default: 19 }
        active: { type: boolean }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id: { type: integer }
            account_id: { type: integer }
            gross_price: { type: number }
            created_at: { type: string }
            updated_at: { type: string, nullable: true }
    Revenue:
      type: object
      properties:
        year: { type: integer }
        months:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: 2024-03 }
              label: { type: string, example: Mär }
              count: { type: integer }
              net: { type: number }
              tax: { type: number }
              gross: { type: number }
              paid: { type: number }
              drafts_gross: { type: number }
        total: { type: object }
    Flag:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        default: { type: boolean }
        overridden: { type: boolean }
        updated_at: { type: string, nullable: true }
