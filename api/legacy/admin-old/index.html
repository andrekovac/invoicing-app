<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Rechnungen - Admin (alt)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rechnungen</h1>
    <nav>
      <a href="#/invoices">Rechnungen</a>
      <a href="#/customers">Kunden</a>
      <a href="#/settings" id="nav-settings">Einstellungen</a>
      <a href="#" id="logout">Abmelden</a>
    </nav>
  </header>

  <main>
    <div id="msg" class="msg hidden"></div>

    <section id="view-login" class="view hidden">
      <h2>Anmelden</h2>
      <form id="login-form">
        <label>E-Mail <input name="email" type="email" autocomplete="username" required></label>
        <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button type="submit">Anmelden</button></div>
      </form>
    </section>

    <!-- invoice list -->
    <section id="view-invoices" class="view hidden">
      <div class="summary" id="inv-summary"></div>
      <div class="toolbar">
        <input id="inv-q" type="search" placeholder="Nummer oder Kunde">
        <select id="inv-status">
          <option value="">Alle</option>
          <option value="draft">Entwurf</option>
          <option value="issued">Gestellt</option>
          <option value="paid">Bezahlt</option>
          <option value="cancelled">Storniert</option>
        </select>
        <button id="inv-new">Neue Rechnung</button>
      </div>
      <table class="list">
        <thead>
          <tr><th>Nummer</th><th>Kunde</th><th>Datum</th><th>Fällig</th><th>Status</th><th class="num">Brutto</th></tr>
        </thead>
        <tbody id="inv-rows"></tbody>
      </table>
    </section>

    <!-- invoice edit -->
    <section id="view-invoice" class="view hidden">
      <h2 id="inv-title">Rechnung</h2>
      <form id="inv-form">
        <div class="row">
          <label>Kunde <select name="customer_id" id="inv-customer"></select></label>
          <label>Steuersatz
            <select name="vat_rate">
              <option value="0.19">19 %</option>
              <option value="0.07">7 %</option>
              <option value="0">0 %</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Rechnungsdatum <input type="date" name="issue_date"></label>
          <label>Fällig am <input type="date" name="due_date"></label>
        </div>

        <table class="items">
          <thead>
            <tr><th>Beschreibung</th><th class="num">Menge</th><th class="num">Einzelpreis</th><th class="num">Summe</th><th></th></tr>
          </thead>
          <tbody id="item-rows"></tbody>
        </table>
        <button type="button" id="item-add">+ Position</button>

        <div class="row">
          <label>Rabatt % <input name="discount_percent" size="5" value="0"></label>
        </div>
        <label>Interne Notiz (nicht auf der Rechnung)
          <textarea name="note" rows="2" cols="60"></textarea>
        </label>
        <button type="button" id="note-save" class="hidden">Notiz speichern</button>

        <div id="mail-box" class="mailbox hidden">
          <div><b>An:</b> <span id="mail-to"></span></div>
          <div><b>Betreff:</b> <span id="mail-subject"></span></div>
          <textarea id="mail-body" rows="8" readonly></textarea>
        </div>

        <table class="totals">
          <tr><td>Netto</td><td class="num" id="t-net"></td></tr>
          <tr><td>USt.</td><td class="num" id="t-tax"></td></tr>
          <tr class="sum"><td>Brutto</td><td class="num" id="t-gross"></td></tr>
        </table>

        <div class="actions">
          <button type="submit" id="inv-save">Speichern</button>
          <button type="button" id="inv-issue">Rechnung stellen</button>
          <button type="button" id="inv-paid">Als bezahlt markieren</button>
          <button type="button" id="inv-copy">Kopieren</button>
          <button type="button" id="inv-mail">Mail-Text</button>
          <button type="button" id="inv-cancel" class="danger">Stornieren</button>
          <button type="button" id="inv-delete" class="danger">Löschen</button>
          <a id="inv-pdf" href="#" target="_blank">PDF</a>
          <a id="inv-txt" href="#" target="_blank">Text</a>
          <a href="#/invoices">Zurück</a>
        </div>
      </form>
    </section>

    <!-- customers -->
    <section id="view-customers" class="view hidden">
      <div class="toolbar">
        <input id="cust-q" type="search" placeholder="Name oder Ort">
        <button id="cust-new">Neuer Kunde</button>
      </div>
      <table class="list">
        <thead>
          <tr><th>Name</th><th>Ort</th><th>E-Mail</th></tr>
        </thead>
        <tbody id="cust-rows"></tbody>
      </table>
    </section>

    <section id="view-customer" class="view hidden">
      <h2 id="cust-title">Kunde</h2>
      <form id="cust-form">
        <label>Name <input name="name" required></label>
        <label>Ansprechpartner <input name="contact_name"></label>
        <label>Straße <input name="street"></label>
        <div class="row">
          <label>PLZ <input name="zip" size="6"></label>
          <label>Ort <input name="city"></label>
          <label>Land <input name="country" placeholder="Deutschland"></label>
        </div>
        <div class="row">
          <label>E-Mail <input name="email" type="email"></label>
          <label>Telefon <input name="phone"></label>
        </div>
        <label>USt-IdNr. <input name="vat_id"></label>
        <div class="actions">
          <button type="submit">Speichern</button>
          <button type="button" id="cust-delete" class="danger">Löschen</button>
          <a href="#/customers">Zurück</a>
        </div>
      </form>
      <h3>Rechnungen</h3>
      <table class="list">
        <tbody id="cust-invoices"></tbody>
      </table>
    </section>

    <!-- settings (admin only) -->
    <section id="view-settings" class="view hidden">
      <h2>Firma</h2>
      <form id="acc-form">
        <label>Name <input name="name" required></label>
        <label>Straße <input name="street"></label>
        <div class="row">
          <label>PLZ <input name="zip" size="6"></label>
          <label>Ort <input name="city"></label>
        </div>
        <div class="row">
          <label>IBAN <input name="iban"></label>
          <label>Steuernummer <input name="tax_number"></label>
        </div>
        <div class="actions"><button type="submit">Speichern</button></div>
      </form>

      <h2>Benutzer</h2>
      <table class="list">
        <thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th></th></tr></thead>
        <tbody id="user-rows"></tbody>
      </table>
      <form id="user-form">
        <div class="row">
          <label>Name <input name="name"></label>
          <label>E-Mail <input name="email" type="email" required></label>
        </div>
        <div class="row">
          <label>Passwort <input name="password" type="password" required minlength="8"></label>
          <label>Rolle
            <select name="role"><option value="user">Benutzer</option><option value="admin">Admin</option></select>
          </label>
        </div>
        <div class="actions"><button type="submit">Benutzer anlegen</button></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
